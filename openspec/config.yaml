schema: spec-driven

# 项目上下文
context: |
  项目名称：keep-eyes
  项目类型：Windows 桌面护眼提醒软件
  目标平台：Windows 10 和 Windows 11
  技术栈：Electron、React、TypeScript
  包管理器：npm
  测试框架：Vitest
  文档语言：简体中文
  用户界面语言：简体中文
  代码标识符：使用英文
  应用必须优先支持本地运行，不依赖账号、后端服务或云同步。
  第一版重点是小而可靠的 MVP，不要主动扩大功能范围。

# 每类文档的规则
rules:
  proposal:
    - 使用简体中文编写
    - 明确区分 MVP 范围和未来功能
    - 必须说明非目标范围

  specs:
    - 使用简体中文编写
    - 需求必须描述用户或外部系统可观察的行为
    - 场景使用“当 / 那么”结构
    - 每个需求至少包含一个可验证场景

  design:
    - 使用简体中文编写
    - 说明 Electron 主进程、渲染进程和预加载脚本的边界
    - 说明本地设置持久化方案
    - 涉及 Windows 系统操作时必须说明安全边界、失败降级和测试方式

  tasks:
    - 使用简体中文编写
    - 按依赖顺序组织任务
    - 每个核心行为都必须有对应测试任务
    - 每项任务必须包含验证方式

# 应用和归档指导
operations:
  apply:
    guidance:
      - 优先使用简体中文解释实施进度和测试结果
      - 每完成一组主要任务后运行类型检查和测试
      - 不实现已批准 Change 范围以外的功能
      - 保持 Electron 安全设置启用

  archive:
    guidance:
      - 归档前确认所有任务和测试已完成
      - 使用简体中文总结归档结果
